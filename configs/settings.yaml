# ARD pipeline settings
# ---------------------

# Path to the ard-isaaclab-tasks checkout — the RL task substrate ARD trains
# against. Each candidate reward is injected into a task env file inside a fresh
# copy of this repo, packaged, and built + run locally as a docker job.
tasks_repo: "/home/lee/code/ard-isaaclab-tasks"

# Where ARD runs each candidate and keeps its logs. Every candidate's training
# job runs in its own <output_dir>/<task>/<tag>/ directory (the container's /work
# mount) and its logs / per-run records are read from there in place.
output_dir: "./runs"

# Where per-candidate codebases are staged before build/submit (a fresh copy of
# tasks_repo with the proposed reward spliced in, plus its build-context tarball).
# Kept inside the workspace under ./runs/ (git-ignored) instead of an ephemeral
# /tmp dir, so the exact code that was built can be inspected. Relative paths are
# resolved to absolute. Leave unset to use a throwaway temp dir.
# NOTE: nothing auto-prunes this — clear ./runs/_codebases periodically.
build_root: "./runs/_codebases"

# Local runner: ARD builds + runs each candidate's training job on this machine
# via docker, one job at a time.
#
# Deploy-by-Dockerfile: every job ships the ard-isaaclab-tasks codebase
# (Dockerfile at its root), which is BUILT per job — there is no prebuilt image
# tag to configure. The task image's entrypoint is driven by the job `env`, so
# ARD passes TASK (and SEED for eval runs) there automatically.
runner:
  # Docker image repo (per-job tags are appended per candidate).
  # image: "ard-local"
  # GPU: true attaches the local GPU (docker run --gpus all); false runs
  # CPU-only. One candidate runs at a time — there is no fractional-GPU request.
  use_gpu: true
  timeout_seconds: 36000
  # Extra container env applied to every job (the entrypoint reads these).
  # Smoke-test setting: cap PPO iterations so each job finishes quickly.
  # env:
  #   MAX_ITERATIONS: "150"    # PPO iterations (--max_iterations)
  #   NUM_ENVS: "1024"        # parallel envs (--num_envs)
  # Optional `docker build --build-arg` values:
  # build_args: {}
  # Optional override of the image CMD (placeholders {task}, {seed}). Leave unset
  # to use the image's env-driven entrypoint (the recommended path).
  # command_template: "bash quickstart.sh {task}"
