# ARD pipeline settings
# ---------------------

# Path to the ard-isaaclab-tasks checkout — the RL task substrate ARD trains
# against. Each candidate reward is injected into a task env file inside a fresh
# copy of this repo, packaged, and built + run locally as a docker job.
tasks_repo: "/home/fu/ard-isaaclab-tasks"

# Where ARD runs each candidate and keeps its logs. Every candidate's training
# job runs in its own <output_dir>/<task>/<tag>/ directory (the container's /work
# mount) and its logs / per-run records are read from there in place.
output_dir: "./runs"

# Where per-candidate codebases are staged before build/submit (a fresh copy of
# tasks_repo with the proposed reward spliced in, plus its build-context tarball).
# Kept inside the workspace under ./runs/ (git-ignored) instead of an ephemeral
# /tmp dir, so the exact code that was built can be inspected. Relative paths are
# resolved to absolute. Leave unset to use a throwaway temp dir.
# NOTE: nothing auto-prunes this — clear ./runs/_codebases periodically.
build_root: "./runs/_codebases"

# Runner: how ARD trains each candidate. `backend` selects the execution path.
#   local (default): build + `docker run` each candidate on this machine, one at
#                    a time. Deploy-by-Dockerfile — every job ships the
#                    ard-isaaclab-tasks codebase (Dockerfile at its root), BUILT
#                    per job; the image entrypoint is driven by the job `env`, so
#                    ARD passes TASK (and SEED for eval runs) there automatically.
#   hpc:             build + push each candidate's image to the CARES registry and
#                    submit it to the CARES HPC Scheduler; the whole batch trains
#                    CONCURRENTLY on the cluster. Artifacts land on the NAS and are
#                    recycled into ./runs as each job finishes.
runner:
  backend: hpc            # local | hpc

  # --- local backend --------------------------------------------------------
  # Docker image repo (per-job tags are appended per candidate).
  # image: "ard-local"
  # GPU: true attaches the local GPU (docker run --gpus all); false runs
  # CPU-only. One candidate runs at a time — there is no fractional-GPU request.
  use_gpu: true
  timeout_seconds: 7200
  # Extra container env applied to every job. On the local backend the entrypoint
  # reads these; on the hpc backend the scheduler DROPS the job env block, so ARD
  # translates MAX_ITERATIONS/NUM_ENVS into --max_iterations/--num_envs command
  # flags instead (WANDB_* cannot be forwarded to hpc jobs — they'd leak the key).
  # `plasticity: true` similarly gets translated into a --plasticity flag on
  # scripts/train.py (not a raw passthrough env var — the image entrypoint has
  # no dedicated variable for it).
  # Smoke-test setting: cap PPO iterations so each job finishes quickly.
  env:
    MAX_ITERATIONS: "5000"    # PPO iterations (--max_iterations) — clears shadow_hand's save_best_after:100 with margin. 300 for smoke test, 5000 for true.
    NUM_ENVS: "2048"         # parallel envs (--num_envs) — scaled down from the task's default 8192; must be a
    # multiple of 2048 for shadow_hand specifically (batch_size = num_envs * horizon_length(16) must divide
    # evenly into minibatch_size(32768) per its rl_games_ppo_cfg.yaml, unlike cartpole which tolerated 1024)
    plasticity: true  
           # enables plasticity monitoring/unit-replacement (--plasticity on train.py)

  # Optional `docker build --build-arg` values (local backend):
  # build_args: {}
  # Optional override of the image CMD (placeholders {task}, {seed}). Leave unset
  # to use the image's env-driven entrypoint (the recommended path).
  # command_template: "bash quickstart.sh {task}"

  # --- hpc backend (used only when backend: hpc) ----------------------------
  # Prerequisites (one-off): the HPC client must be installed + logged in
  #   pip install -e /home/lee/hpc-client
  #   hpc-client configure --scheduler-url http://<scheduler-host>:8080
  #   hpc-client login <upi>              # or export HPC_PASSWORD for auto-relogin
  # and the CARES registry must be in Docker's insecure-registries (see
  # ard-isaaclab-tasks/scripts/hpc_push.sh) so `docker push` works.
  hpc:
    registry: "130.216.238.2:5500"       # CARES container registry
    image_repo: "fzho027_ard-isaaclab"    # <registry>/<image_repo>:<candidate-tag>
    nas_outputs: "~/hpc_outputs"         # local mount of the NAS outputs share
    max_runtime_hours: 2.0               # per-job wall-clock cap the scheduler enforces
    poll_seconds: 30                     # how often the monitor loop polls each job
    datasets: []                         # NAS datasets to mount read-only (required_datasets)
    job_name_prefix: "ard"               # job names: <prefix>_<tag> (e.g. ard_iter1_run_0)
    extra_args: ""                       # raw flags appended to hpc_entrypoint.sh
    # max_active_jobs: 50                 # scheduler cap guard (default 50)
